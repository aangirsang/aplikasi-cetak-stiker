spring.application.name=aplikasi-cetak-stiker
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.girsang.stiker.config.RingkasSqlInspector

# ==============================
# Database SQLite
# ==============================
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${app.data.dir}/database/${app.database.name}
spring.datasource.username=
spring.datasource.password=

# ==============================
# JPA & Hibernate
# ==============================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_updates=true

# ==============================
# UPLOAD
# ==============================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ==============================
# STORAGE
# ==============================
#app.data.dir=./data
app.data.dir=${LOCALAPPDATA:${user.home}/AppData/Local}/Aplikasi Cetak Stiker/data
app.database.name=cetak-stiker.db

# ==============================
# LOGGING
# ==============================
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Log SQL dimatikan, diganti log ringkas dari RingkasSqlInspector
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Log aplikasi dan log ringkas data (logger bernama "DATA")
logging.level.com.girsang.stiker=INFO
logging.level.DATA=INFO

logging.pattern.console=%d{HH:mm:ss} %-5level %logger{20} - %msg%n
spring.output.ansi.enabled=always

spring.jpa.properties.hibernate.default_batch_fetch_size=50