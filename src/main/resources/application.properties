spring.application.name=aplikasi-cetak-stiker

# ==============================
# Database SQLite
# ==============================
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${app.data.dir}/database/${app.database.name}
spring.datasource.username=
spring.datasource.password=

# ==============================
# JPA & Hibernate
# ==============================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ==============================
# UPLOAD
# ==============================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ==============================
# STORAGE
# ==============================
#app.data.dir=./data
app.data.dir=${LOCALAPPDATA:${user.home}/AppData/Local}/Aplikasi Cetak Stiker/data
app.database.name=cetak-stiker.db

# ==============================
# LOGGING
# ==============================
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN