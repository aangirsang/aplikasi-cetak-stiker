<div class="data-orderan">
    <!-- SEARCH -->
    <div class="search-bar-date">
        <div class="search-box">
            <span class="material-symbols-sharp">search</span>
            <label>
                <input type="text" id="txt-cari-data-orderan" placeholder="Cari Data Orderan">
            </label>
        </div>
        <!-- RANGE TANGGAL -->
        <div class="date-range-box">

            <span class="material-symbols-sharp">calendar_month</span>

            <label for="cari-range-tanggal-data-orderan"></label><input
                    type="text"
                    id="cari-range-tanggal-data-orderan"
                    placeholder="Pilih rentang tanggal">

        </div>
        <div class="search-bar-buttons">
            <button class="add-btn" id="btn-refresh-data-orderan">
                <span class="material-symbols-sharp">autorenew</span>
            </button>
            <button class="add-btn" id="btn-tambah-data-orderan">
                <span class="material-symbols-sharp">add</span>
            </button>
            <button class="add-btn" id="btn-download-data-orderan">
                <span class="material-symbols-sharp">download</span>
            </button>
        </div>

    </div>
    <!-- TABLE -->
    <div class="table-page-container">
        <div class="tabel-page-card">
            <table class="tbl-data">
                <thead>
                <tr>
                    <th onclick="sortTabelDashboard('faktur')">Faktur</th>
                    <th onclick="sortTabelDashboard('tanggal')">Tanggal</th>
                    <th onclick="sortTabelDashboard('namaUmkm')">Nama Usaha</th>
                    <th onclick="sortTabelDashboard('totalStiker')">Total Stiker</th>
                </tr>
                </thead>
                <tbody id="tbl-body-data-orderan"></tbody>
            </table>
        </div>
        <div id="pagination" class="pagination"></div>
    </div>
    <!-- POPUP ORDERAN -->
    <div class="popup" id="popup-data-orderan">
        <div class="content-popup-data-order">
            <form id="form-data-order">
                <div class="form-data-order-atas">
                    <div class="form-data-order-atas-kiri">
                        <h2 id="title-popup-data-orderan">Data Orderan</h2>
                        <h2 id="data-order-umkm">Nama Pemilik - Nama Usaha</h2>
                    </div>
                    <div class="form-data-order-atas-kanan">
                        <label id="data-order-tanggal">Tanggal Orderan</label>
                        <label id="data-order-faktur">Faktur</label>
                        <label id="data-order-jumlah">10 Lembar</label>
                    </div>
                </div>
                <div class="form-data-order-grid">

                    <div class="form-data-order-grid-kanan" id="form-data-order-grid-kanan">
                        <div id="data-order-stiker-list" class="data-order-stiker-list"></div>
                        <button type="button" id="btn-stiker-data-order">Tambah Stiker</button>
                    </div>
                </div>
                <div class="popup-actions">
                    <button type="button" id="btn-simpan-data-order">Simpan</button>
                    <button type="button" id="btn-batal-data-order">Batal</button>
                </div>
            </form>
        </div>
    </div>

    <!--POPUP DOWNLOAD PENYESUAIAN-->
    <div class="popup" id="popup-download-data-orderan">
        <div class="content-popup-download-data-orderan">
            <form id="form-popup-download-data-orderan">
                <h2 id="popup-download-data-orderan-title">Download Data Orderan</h2>
                <div class="isi-popup-download-data-orderan">
                    <div class="date-range-box">
                        <span class="material-symbols-sharp">calendar_month</span>
                        <label for="cari-range-tanggal-download-data-orderan"></label><input
                                type="text"
                                id="cari-range-tanggal-download-data-orderan"
                                placeholder="Pilih rentang tanggal">
                    </div>
                    <div class="custom-select" id="custom-select-data-rekap-orderan">
                        <label class="select-label">Pilih Rekap</label>
                        <div class="select-box">
                            <span id="selected-text-data-rekap-orderan" class="empty"></span>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="options" id="options-data-rekap-orderan"></div>
                    </div>
                </div>

                <div class="popup-actions">
                    <button type="button" id="btn-popup-download-data-orderan-download">Download</button>
                    <button type="button" id="btn-popup-download-data-orderan-batal">Batal</button>
                </div>
            </form>
        </div>
    </div>
</div>
