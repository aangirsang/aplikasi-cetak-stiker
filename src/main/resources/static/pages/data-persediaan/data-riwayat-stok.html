<div class="data-riwayat-stok">
  <div class="search-bar-date">
    <div class="search-box">
      <span class="material-symbols-sharp">search</span>
      <label>
        <input type="text" id="txt-cari-data-riwayat-stok" placeholder="Cari Data Barang">
      </label>
    </div>
    <!-- RANGE TANGGAL -->
    <div class="date-range-box">
      <span class="material-symbols-sharp">calendar_month</span>
      <label for="cari-range-tanggal-data-riwayat-stok"></label><input
              type="text"
              id="cari-range-tanggal-data-riwayat-stok"
              placeholder="Pilih rentang tanggal">

    </div>
    <div class="search-bar-buttons">
      <button class="add-btn" id="btn-refresh-data-riwayat-stok">
        <span class="material-symbols-sharp">autorenew</span>
      </button>
      <button class="add-btn" id="btn-download-data-riwayat-stok">
        <span class="material-symbols-sharp">download</span>
      </button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-page-container">
    <div class="tabel-page-card">
      <table class="tbl-data">
        <thead>
        <tr>
          <th onclick="sortTableRiwayatStok('tanggal')">Tanggal</th>
          <th onclick="sortTableRiwayatStok('namaPengguna')">Nama User</th>
          <th onclick="sortTableRiwayatStok('namaBarang')">Nama Barang</th>
          <th onclick="sortTableRiwayatStok('jenis')">Jenis Perubahan</th>
          <th onclick="sortTableRiwayatStok('saldoAwal')">Stok Awal</th>
          <th onclick="sortTableRiwayatStok('perubahan')">Perubahan Stok</th>
          <th onclick="sortTableRiwayatStok('saldoAkhir')">Stok Akhir</th>
        </tr>
        </thead>
        <tbody id="tbl-body-data-riwayat-stok"></tbody>
      </table>
    </div>
    <div id="pagination" class="pagination"></div>
  </div>

  <!--POPUP DOWNLOAD RIWAYAT-->
  <div class="popup" id="popup-download-data-riwayat-stok">
    <div class="content-popup-download-data-riwayat-stok">
      <form id="form-popup-download-data-riwayat-stok">
        <h2 id="popup-download-data-riwayat-stok-title">Download Data Riwayat Stok</h2>
        <div class="date-range-box">
          <span class="material-symbols-sharp">calendar_month</span>
          <label for="cari-range-tanggal-download-data-riwayat-stok"></label><input
                  type="text"
                  id="cari-range-tanggal-download-data-riwayat-stok"
                  placeholder="Pilih rentang tanggal">
        </div>
        <div class="popup-actions">
          <button type="button" id="btn-popup-download-data-riwayat-stok-download">Download</button>
          <button type="button" id="btn-popup-download-data-riwayat-stok-batal">Batal</button>
        </div>
      </form>
    </div>
  </div>
</div>
